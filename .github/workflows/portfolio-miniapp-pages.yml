name: Deploy portfolio mini-app

on:
  push:
    branches: [main]
    paths:
      - 'portfolio-miniapp/**'
      - '.github/workflows/portfolio-miniapp-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish mini-app to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./portfolio-miniapp
          publish_branch: gh-pages
          force_orphan: true
